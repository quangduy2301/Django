{% extends "base.html" %}

{% block content %}
    <hr>
    <h1>{{ post.title }}</h1>
    <hr>
    {% for post in posts %}
        <article>
            <p>Bởi {{ post.author.username }} vào {{ post.created_at|date:"d/m/Y" }}</p>
            <p>{{ post.content|truncatewords:30 }}</p>
        </article>
    {% endfor %}
    <hr>
    <h2>Bình luận</h2>
    <button>Viết bình luận</button>
{% endblock %}
