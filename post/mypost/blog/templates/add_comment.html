{% extends "base.html" %}
{% block content %}
    <div class="row justify-content-center">
        <div class="col md-6">
            <hr>
            <h1 class="text-uppercase">Bình luận</h1>
            <hr>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form.body }}
                </div>
                <button title="Gửi bình luận" type="submit" class="btn btn-primary">Gửi bình luận</button>
                <a href="javascript:history.back()" title="Hủy" class="btn btn-secondary">Hủy</a>
            </form>
        </div>
    </div>
{% endblock %}
