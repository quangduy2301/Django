<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa bài đăng</title>
</head>
{% extends "base.html" %}
{% block content %}
    <hr>
    <form method="POST" onsubmit="chuyen_nut()">
        {% csrf_token %}
        <fieldset>
            <h1 class="text-uppercase text-danger">Bạn có muốn xóa bài đăng "{{ post.title }}"?</h1>
            <p class="text-muted">Hành động này không thể hoàn tác.</p>
            <hr>
        </fieldset>
        <div>
            <button title="Xóa" id="delete_btn" type="submit" class="btn btn-danger">Xóa</button>
            <a href="javascript:history.back()" title="Hủy" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
    <script>
        function chuyen_nut() {
            var btn = document.getElementById("delete_btn");
            btn.textContent = 'Đang xóa...';
            btn.disabled = true;
        }
    </script>
{% endblock %}
