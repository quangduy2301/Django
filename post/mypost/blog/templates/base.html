<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ post.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-warning bg-opacity-25">
  <nav class="navbar navbar-expand-lg bg-light">
  <div class="container-fluid">
    <a class="navbar-brand text-success" href="/blog/">Blog của tôi</a>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
    <form class="d-flex" action="{% url 'post_list' %}" method="GET">
      <input class="form-control me-3" type="search" name="q" placeholder="Tìm bài đăng..." value="{{ request.GET.q }}">
      <button class="btn btn-secondary">Tìm</button>
    </form>
    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
      <li class="nav-item">
        <a class="nav-link link-primary" href="/blog/">Trang chủ</a>
      </li>
      {% if not user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link link-success" href="{% url 'login' %}">Đăng nhập</a>
        </li>
        <li class="nav-item">
          <a class="nav-link link-secondary" href="/register">Đăng ký</a>
        </li>
      {% else %}
        <li class="nav-item">
          <a class="nav-link link-success" href="{% url 'post-create' %}">Thêm bài mới</a>
        </li>
        {% if user.is_superuser %}
          <li class="nav-item">
            <a class="nav-link link-secondary" href="{% url 'profile' %}">Chào, {{ user.username }}!</a>
          </li>
        {% endif %}
        <li class="nav-item">
          <form action="{% url 'logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-link nav-link link-danger">Đăng xuất</button>
          </form>
        </li>
      {% endif %}
    </ul>
    </div>
  </div>
  </nav>
  <main class="container">
      {% block content %}{% endblock %}
  </main>
  <script src="https:/cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
