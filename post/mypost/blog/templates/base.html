<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ post.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/blog/" title="Blog của tôi">Blog của tôi</a>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link text-secondary" href="/blog/" title="Trang chủ">Trang chủ</a>
        </li>
        {% if not user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link text-primary" href="{% url 'login' %}" title="Đăng nhập">Đăng nhập</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-success" href="/register" title="Đăng ký">Đăng ký</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link text-success" href="{% url 'post-create' %}" title="Thêm bài mới">Thêm bài mới</a>
          </li>
          {% if user.is_superuser %}
            <li class="nav-item">
              <a class="nav-link text-primary" href="/admin/" title="Quản lý hệ thống">Quản lý hệ thống</a>
            </li>
          {% endif %}
          <li class="nav-item">
            <form action="{% url 'logout' %}" method="post" class="d-inline">
              {% csrf_token %}
              <button type="submit" title="Đăng xuất" class="btn btn-link nav-link text-danger">Đăng xuất</button>
            </form>
          </li>
        {% endif %}
      </ul>
      </div>
    </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="https:/cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
