<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
</head>
{% extends "base.html" %}
{% block content %}
<form method="post">
    {% csrf_token %}
    <h1 class="text-uppercase text-center">Đăng nhập</h1>
    <br>
    <label for="user" class="fs-4">Tên đăng nhập</label>
    {{ form.username }}
    <br>
    <br>
    <label for="pass" class="fs-4">Mật khẩu</label>
    {{ form.password }}
    <br>
    <br>
    <button type="submit" title="Đăng nhập" class="btn btn-primary fs-6">Đăng nhập</button>
    <a href="javascript:history.back()" title="Hủy" class="btn btn-secondary">Hủy</a>
</form>
{% endblock %}
